# 本配置文件不上库（.gitignore）。复制 config.example.yaml 为 config.yaml 后按需修改。
asr:
  # HF repo id（首次自动下载）或本地模型目录路径（~ 会自动展开）
  model: mlx-community/Qwen3-ASR-1.7B-8bit
  # 更省内存的备选：mlx-community/Qwen3-ASR-1.7B-5bit / Qwen3-ASR-0.6B-5bit
  language: auto          # auto / Chinese / English ...（中英混说保持 auto）
  context: ""             # ASR 热词（个人词典会自动注入，一般留空）

llm:
  # 二选一：
  # ① 云端 OpenAI 兼容接口（推荐：不吃内存、无冷启动；文本会上行，音频始终不出本机）
  provider: openai
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY   # 密钥写在项目根目录 .env：DEEPSEEK_API_KEY=sk-xxx
  disable_thinking: true          # 关闭思维链（DeepSeek v4 默认开启，短文本润色用不上）
  timeout: 20
  # ② 本地 Ollama（离线零成本，但 4B 模型约占 4GB 内存，且闲置 5 分钟卸载后再用需重新加载）
  # provider: ollama
  # base_url: http://127.0.0.1:11434
  # model: qwen3.5:4b-mlx
  # think: false                  # 关闭思考
  # keep_alive: 30m               # 延长驻留，避免闲置后首句等 30s
  enabled: true           # false = 直通 ASR 原文（--raw 等效）

inject:
  chars_per_second: 60    # 逐字打字速度（非流式：模型处理完一次性打出）
  initial_delay_ms: 50    # 注入前等待，确保目标输入框焦点稳定

hotkey:
  key: fn                 # fn
  mode: toggle            # toggle=按一下开始、再按一下结束（然后开始 Thinking 处理）
  # 纠错手势：选中你改正后的文本，按住 Ctrl 点按 Fn → 学习纠错对

memory:
  db: data/memory.db      # SQLite：词典 + 历史
  max_hotwords: 80        # 注入 ASR 的热词上限

hud:
  enabled: true           # Fn 按下时屏幕下方显示波形浮层
  # 视觉参数（宽度/高度/颜色速度/attack/release 等）在 voice_input/hud.py 的 C 类中调整

vad:
  # Silero VAD（约 2MB）：波形只对人声响应，键盘/风扇声不触发
  # 下载：curl -L -o models/silero_vad.onnx https://raw.githubusercontent.com/snakers4/silero-vad/master/src/silero_vad/data/silero_vad.onnx
  model: models/silero_vad.onnx

autolearn:
  enabled: true           # watch the target field after injection; user edits
                          # are auto-learned into the dictionary (Typeless-style)
